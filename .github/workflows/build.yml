name: build

on: ["push", "pull_request"]

jobs:
  build:

    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 20
        uses: actions/setup-node@v2
        with:
          node-version: 20
      - name: ci
        run: |
          npm install --force
          npm run ci